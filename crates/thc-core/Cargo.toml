[package]
name = "thc-core"
description = "Core model, event log, merge/replay and SQLite store for thc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
caretline = { path = "../caretline", features = ["serde"] }
anyhow.workspace = true
chrono.workspace = true
libc.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
ulid.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }

[dev-dependencies]
rand.workspace = true
rusqlite.workspace = true
