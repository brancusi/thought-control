[package]
name = "caretline-mcp"
description = "An MCP server for caretline: agents read and edit a live editor alongside a person, with guarded writes, attribution and exact replay"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true

[[bin]]
name = "caretline-mcp"
path = "src/main.rs"

[dependencies]
# The engine, for headless sessions in process. Live editors are reached over their socket.
caretline = { path = "../caretline" }
# The official MCP SDK (Apache-2.0).
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
serde_json = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
