[package]
name = "caretline-app"
description = "caretline: a terminal text editor on the caretline engine, with state snapshots and exact replay"
version = "0.2.0"
edition.workspace = true
license = "MIT"
repository.workspace = true

[[bin]]
name = "caretline"
path = "src/main.rs"

[dependencies]
caretline = { path = "../caretline" }
ratatui = "0.30"
crossterm = "0.29"
serde_json = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
