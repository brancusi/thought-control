[package]
name = "thc"
description = "thought control: a CLI-first, local-first stash for notes, todos and dates"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thc"
path = "src/main.rs"

[dependencies]
# LOCAL-ONLY path dependency (see the root Cargo.toml patch): `thc schema --proto`.
caretline-layers = { path = "../../../.caretline-for-thc/crates/caretline-layers", default-features = false }
tempfile = "3"
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
thc-core = { path = "../thc-core" }
thc-tui = { path = "../thc-tui" }
thc-daemon = { path = "../thc-daemon" }
