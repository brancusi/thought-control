[package]
name = "thc-screen"
description = "thc's views as fictty UIs: feeds (store to view JSON), screens (the fictty Ui) and themes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thc-core = { path = "../thc-core" }
unicode-width = "0.2"
# fictty: the terminal UI runtime (a UI is one serializable value), embedded through its App and
# Host API. Pinned to a commit of its main until it publishes.
fictty = { git = "https://github.com/brancusi/fictty", rev = "5218bf9cfca78eed97350e6e8ca30461f5c84bbe" }
