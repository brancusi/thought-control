[package]
name = "caretline"
description = "A plain-text block editor engine: Markdown in, blocks out, with exact caret motion"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
homepage = "https://thoughtcontrol.app"

# The boundary (engine-extraction.md): no thc crate, ever. CI fails if one appears here.
[dependencies]
unicode-segmentation = "1"
unicode-width = "0.2"
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]
