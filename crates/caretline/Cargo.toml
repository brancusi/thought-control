[package]
name = "caretline"
description = "A standalone text-editing engine: Helix's selection, transaction and history model in a pure, replayable Elm architecture"
version = "0.2.1"
# The vendored Helix files are written for the 2021 edition.
edition = "2021"
# The crate is MIT; the vendored files under src/helix are MPL-2.0 (file-level).
license = "MIT AND MPL-2.0"
repository.workspace = true
homepage = "https://caretline.app"
documentation = "https://docs.rs/caretline"

# A standalone engine: no terminal, no ratatui and no thc crate.
[lib]
doctest = false

[dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
smallvec = { version = "1.15", features = ["serde"] }
smartstring = { version = "1.0.1", features = ["serde"] }
unicode-segmentation = "1.13"
# Helix pins this version: newer width tables disagree with common terminals.
unicode-width = "=0.1.12"
unicode-general-category = "1.1"
serde = { workspace = true }
serde_json = { workspace = true }

log = "0.4"

[features]
# Upstream Helix feature: treat every Unicode line separator as a line break.
unicode-lines = ["ropey/unicode_lines"]

[dev-dependencies]
rand = { workspace = true }
