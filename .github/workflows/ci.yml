name: CI

# Runs on every push to main and release/**, and on demand (Actions → CI → Run workflow): the
# tests a tag would run, with no signing and no publishing. Catches merge damage (a dropped brace,
# a test that stopped running) before it can reach a release tag.
on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15          # Apple silicon, like the release build
    steps:
      - uses: actions/checkout@v4

      - name: No conflict markers
        # A cherry-pick conflict committed with its markers must never reach a tag (v0.7.2).
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- ':!*.md'; then
            echo "conflict markers in tracked files" >&2; exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Canary (nothing outside the scratch roots may change)
        run: touch "$RUNNER_TEMP/canary"

      - name: cargo test (includes the schema contract)
        run: cargo test --workspace

      - name: No thc process outlives the tests
        # Daemons and TUIs started by tests exit with their test process (THC_TEST_PARENT); a
        # leftover means a test child escaped. Give the watchdogs a second to notice.
        run: |
          sleep 2
          if pgrep -fl 'target/debug/thc '; then echo "thc processes outlived the test run" >&2; exit 1; fi

      - name: Editor performance guard (SPEC §8.1)
        # A coarse guard for order-of-magnitude regressions only (SPEC §8 budgets are targets, not
        # gates): typing into a 5,000-line page under 40 ms p50 and a 300-line day
        # opening under 50 ms on the runner (both about 4 ms on a fast Mac; a per-key whole-document
        # scan once made typing 60 ms, unnoticed). Built without LTO to keep CI quick.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --release -q -p thc
          out="$(THC="$PWD/target/release/thc" scripts/bench-editor.sh 2>&1)"
          echo "$out"
          bad=0
          for label in "type at top" "type middle"; do
            p50="$(echo "$out" | grep "$label" | sed -n 's/.*p50 \([0-9.]*\) ms.*/\1/p' | tail -1)"
            [[ -n "$p50" ]] || { echo "no p50 for $label" >&2; bad=1; continue; }
            if awk -v v="$p50" 'BEGIN { exit !(v > 40) }'; then echo "$label: p50 $p50 ms > 40 ms" >&2; bad=1; fi
          done
          # Opening the 300-line day in a vault of ~6,000 events (the budget is ~4 ms; reading the
          # whole history at open once made it 55 ms, growing with the vault, unnoticed).
          day="$(echo "$out" | sed -n '/300-line journal day/,$p' | grep 'first frame' | sed -n 's/.*first frame \([0-9.]*\) ms.*/\1/p' | head -1)"
          [[ -n "$day" ]] || { echo "no first frame for the day" >&2; bad=1; }
          if [[ -n "$day" ]] && awk -v v="$day" 'BEGIN { exit !(v > 50) }'; then echo "day open: $day ms > 50 ms" >&2; bad=1; fi
          exit $bad

      - name: Read performance guard (SPEC §8)
        # Same release profile as the editor guard above. 60 ms mean catches order-of-magnitude
        # regressions only; the <5 ms developer-machine budget is a target (SPEC §8), not a gate.
        run: THC="$PWD/target/release/thc" python3 scripts/bench-read-guard.py

      - name: Convergence actually ran
        # A test file that silently stops compiling into tests (or loses its #[test]s) would pass
        # `cargo test` with nothing run. The convergence suite must run, and run them all.
        run: |
          out="$(cargo test -q -p thc-core --test convergence 2>&1)"
          echo "$out" | tail -3
          n="$(echo "$out" | sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' | head -1)"
          [[ -n "$n" && "$n" -ge 3 ]] || { echo "convergence ran ${n:-0} tests (expected at least 3)" >&2; exit 1; }

      - name: Tests wrote nothing in the real HOME
        # THC_TEST=1 makes thc refuse real paths; this catches anything else a test might do.
        run: |
          bad=0
          for d in "$HOME/thought" "$HOME/.config/thought" "$HOME/.local/bin" "$HOME/Library/LaunchAgents" "$HOME/.claude" "$HOME/.codex" "$HOME/.cache/thc"; do
            [[ -e "$d" ]] || continue
            changed="$(find "$d" -newer "$RUNNER_TEMP/canary" 2>/dev/null | head -5)"
            [[ -z "$changed" ]] || { echo "changed during tests: $changed" >&2; bad=1; }
          done
          # A project config in a shared folder captures every command run under it.
          for f in /.thc.toml /tmp/.thc.toml /private/tmp/.thc.toml /var/tmp/.thc.toml "$TMPDIR/.thc.toml" "$HOME/.thc.toml"; do
            [[ -e "$f" ]] && { echo "stray project config: $f" >&2; bad=1; }
          done
          exit $bad
