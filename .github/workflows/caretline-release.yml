name: caretline release

# Push a tag like caretline-v0.2.0 to build the `caretline` binary (crates/caretline-app) for
# macOS and Linux and publish it as a GitHub Release on this repo:
#   caretline-<v>-<target>.tar.gz (+ .sha256)   one per target
# sites/caretline/public/install.sh (served at https://caretline.app/install.sh) finds the newest
# caretline-v* release, downloads the tarball for the machine and checks its sha256.
#
# Builds aren't Apple-signed: a curl install isn't quarantined. Linux builds are static (musl).
# Manual runs (workflow_dispatch) build, test and smoke-test every target without publishing.
on:
  push:
    tags: ["caretline-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version
        id: v
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/caretline-app/Cargo.toml | head -1)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "caretline-cli version isn't x.y.z: $v" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/caretline-v* ]]; then
            [[ "${GITHUB_REF#refs/tags/caretline-v}" == "$v" ]] || { echo "Tag ${GITHUB_REF#refs/tags/} doesn't match crates/caretline-app ($v)." >&2; exit 1; }
            echo "publish=1" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  draft:
    # A draft release first, so no installer sees a release without its files.
    needs: version
    if: needs.version.outputs.publish == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - name: Create the draft release
        run: |
          tag="caretline-v$V"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists; uploading into it"
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "caretline $V" --notes "$(cat <<EOF
          caretline $V: a terminal text editor with serializable state and exact replay.

          Install (macOS and Linux):

              curl -fsSL https://caretline.app/install.sh | sh && caretline demo

          Or with Rust: \`cargo install caretline-cli\`

          Each tarball holds the \`caretline\` binary; check it against its .sha256.
          EOF
          )"
          fi

  build:
    needs: [version, draft]
    if: always() && needs.version.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, test: true }
          - { os: macos-15, target: x86_64-apple-darwin, test: false }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: true }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.version.outputs.version }}
      T: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: caretline-${{ matrix.target }}

      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Tests
        if: matrix.test
        run: cargo test -p caretline -p caretline-cli

      - name: Build
        run: cargo build --release --locked -p caretline-cli --target "$T"

      - name: Smoke test
        # The x86_64 macOS build runs under Rosetta on the arm runner, when it is there.
        run: |
          b="target/$T/release/caretline"
          if [[ "$T" == x86_64-apple-darwin ]] && ! "$b" --version >/dev/null 2>&1; then
            echo "no Rosetta on this runner: checked the build, not the run"; file "$b"; exit 0
          fi
          "$b" --version
          "$b" --version | grep -qx "caretline $V"
          "$b" demo --help | grep -q 'scenes'
          "$b" demo --snapshot 80x24 | grep -q 'Welcome to caretline'
          "$b" demo scenes --snapshot 80x24 | grep -q 'C A R E T L I N E'
          "$b" demo agent --headless > agent.json
          grep -q '"ok": true' agent.json

      - name: Package
        run: |
          name="caretline-$V-$T"
          mkdir -p "dist/$name"
          cp "target/$T/release/caretline" "dist/$name/"
          cp LICENSE "dist/$name/LICENSE"
          cp crates/caretline/src/helix/LICENSE-MPL-2.0 "dist/$name/LICENSE-MPL-2.0"
          cp crates/caretline-app/README.md "dist/$name/README.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caretline-${{ matrix.target }}
          path: dist/*.tar.gz*

      - name: Upload to the draft release
        if: needs.version.outputs.publish == '1'
        run: gh release upload "caretline-v$V" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber -R "$GITHUB_REPOSITORY"

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - name: Every target's files are there
        run: |
          assets="$(gh release view "caretline-v$V" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for f in "caretline-$V-$t.tar.gz" "caretline-$V-$t.tar.gz.sha256"; do
              echo "$assets" | grep -qx "$f" || { echo "missing $f" >&2; exit 1; }
            done
          done
      - name: Publish
        run: gh release edit "caretline-v$V" -R "$GITHUB_REPOSITORY" --draft=false --latest
