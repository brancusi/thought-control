[workspace]
resolver = "2"
members = ["crates/caretline", "crates/caretline-app", "crates/caretline-mcp", "crates/thc-core", "crates/thc-tui", "crates/thc-daemon", "crates/thc"]

[workspace.package]
version = "0.9.65"
edition = "2024"
license = "MIT"
repository = "https://github.com/brancusi/thought-control"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.9"
ulid = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
