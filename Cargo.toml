[workspace]
resolver = "2"
members = ["crates/thc-core", "crates/thc-tui", "crates/thc-daemon", "crates/thc"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/brancusi/thought-control"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.9"
ulid = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

# caretline (the editor engine) lives at https://github.com/brancusi/caretline and comes from
# crates.io. An engine fix not yet released is pinned here by git revision of that repo, and
# this patch is removed once a caretline release contains it. Never patch the engine in this
# repo; for local work on both, use a path patch to your caretline checkout and don't commit it.
[patch.crates-io]
caretline = { git = "https://github.com/brancusi/caretline", rev = "282c8a531157dd6e95687beff019c8251749c5a3" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
